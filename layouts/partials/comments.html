{{- /* 댓글·좋아요(giscus). hugo.toml의 params.giscus에 repoId·categoryId가 있어야 표시한다. */ -}}
{{- with site.Params.giscus }}
{{- if and .repo .repoId .category .categoryId }}
<section class="comments" aria-labelledby="comments-title">
  <h2 id="comments-title">댓글과 반응</h2>
  <p class="comments-note">GitHub 계정으로 로그인하면 댓글을 남기거나 글에 좋아요 같은 반응을 남길 수 있어요.</p>
  <script src="https://giscus.app/client.js"
    data-repo="{{ .repo }}"
    data-repo-id="{{ .repoId }}"
    data-category="{{ .category }}"
    data-category-id="{{ .categoryId }}"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="light"
    data-lang="ko"
    data-loading="lazy"
    crossorigin="anonymous"
    async></script>
</section>
{{- end }}
{{- end }}
