{{ define "main" }}
<div class="article-shell wrap">
  <section class="article prose-page" aria-labelledby="editor-title">
    <a class="back-link" href="{{ "/" | relURL }}" data-editor-back>← 블로그로 돌아가기</a>
    <header class="article-heading"><h1 id="editor-title">{{ .Title }}</h1></header>
    {{- with site.Params.editorapi }}
    <div data-editor-api="{{ . }}" data-editor-writes="{{ site.Params.editorwrites }}">
      <p role="status" data-editor-status>작성자 확인을 위해 GitHub로 로그인해 주세요.</p>
      <button class="button-primary" type="button" data-editor-login hidden>GitHub로 로그인</button>
      {{- if site.Params.editorwrites }}
      <form class="post-editor" data-editor-form hidden>
        <label for="post-title">제목</label>
        <input id="post-title" name="title" type="text" maxlength="160" required>
        <label for="post-markdown">본문 (Markdown)</label>
        <textarea id="post-markdown" name="markdown" rows="20" required></textarea>
        <div class="post-editor-actions">
          <button class="button-primary" type="submit">저장</button>
          <button class="post-editor-delete" type="button" data-editor-delete hidden>글 삭제</button>
        </div>
      </form>
      <dialog class="post-delete-dialog" aria-labelledby="post-delete-title" aria-describedby="post-delete-message" data-editor-delete-dialog>
        <form method="dialog">
          <h2 id="post-delete-title">글을 삭제할까요?</h2>
          <p id="post-delete-message" data-editor-delete-message></p>
          <div class="post-editor-actions">
            <button class="button-primary" type="submit" value="cancel" autofocus>취소</button>
            <button class="post-editor-delete" type="submit" value="delete">삭제</button>
          </div>
        </form>
      </dialog>
      {{- end }}
      <noscript><p>GitHub로 로그인하려면 JavaScript를 켜 주세요.</p></noscript>
    </div>
    {{- $version := substr (sha256 (readFile "static/js/editor.js")) 0 12 }}
    <script src="{{ "js/editor.js" | relURL }}?v={{ $version }}" defer></script>
    {{- else }}
    <p>현재 글을 편집할 수 없습니다.</p>
    {{- end }}
  </section>
</div>
{{ end }}
