<!doctype html>
<html lang="{{ site.LanguageCode | default "ko" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else if eq .Kind "taxonomy" }}{{ if eq .Data.Plural "tags" }}태그{{ else }}분류{{ end }} · {{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | plainify | truncate 120 }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}">
  <link rel="icon" href="{{ site.Data.brand.mascot | relURL }}" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
  {{- $styleVersion := substr (sha256 (readFile "static/css/style.css")) 0 12 }}
  {{- $scriptVersion := substr (sha256 (readFile "static/js/site.js")) 0 12 }}
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}?v={{ $styleVersion }}">
  <script src="{{ "js/site.js" | relURL }}?v={{ $scriptVersion }}" defer></script>
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">{{ end }}
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  {{ partial "header.html" . }}
  <main id="main">{{ template "main" . }}</main>
  {{ partial "footer.html" . }}
</body>
</html>
