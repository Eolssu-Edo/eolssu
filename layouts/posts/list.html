{{ define "main" }}
{{- $posts := .RegularPages.ByDate.Reverse -}}
<div class="editorial wrap">
  <header class="page-intro"><h1>{{ .Title }}</h1>{{ with .Description }}<p>{{ . }}</p>{{ end }}</header>
  {{ partial "journal.html" (dict "posts" $posts "reading" (first 3 (where $posts "Params.featured" true))) }}
</div>
{{ end }}
