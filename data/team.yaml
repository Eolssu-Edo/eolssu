# 팀 소개(/about/) 화면 문구. 공개에 동의한 팀원 정보만 넣습니다.
intro:
  kicker: "MEET TEAM EDO"
  title: ["우리 소리를 배우는 과정을,", "함께 만듭니다."]
  lead: "Team Edo는 국악기 입문자가 혼자서도 연습을 이어갈 수 있도록 ‘얼쑤’를 만드는 팀입니다."
  origin: "Edo는 세종대왕의 이름 ‘이도’에서 따왔습니다."
people:
  kicker: "OUR PEOPLE"
  title: "여섯 사람, 하나의 연습 경험."
  description: "화면과 사용자 흐름, 서버와 데이터, 분석과 운영을 함께 연결합니다."
# accent: 카드 윗선·역할 글자색, tint: 역할 배경·장식 원
members:
  - name: "송가연"
    role: "FRONTEND · UI"
    headline: "얼쑤의 모습을 그립니다."
    description: "전체 와이어프레임과 UI 구성을 맡습니다. 화면 구조와 시각적 표현을 설계하고, 일관된 앱 화면을 만듭니다."
    accent: "#b6684a"
    tint: "#fbede4"
  - name: "권영민"
    role: "FRONTEND · UX"
    headline: "배움의 흐름을 연결합니다."
    description: "사용 흐름과 상호작용을 중심으로 앱을 개발합니다. 정간보 읽기부터 연습·평가까지 화면과 API를 연결합니다."
    accent: "#437e80"
    tint: "#e8f3f2"
  - name: "오은서"
    role: "BACKEND · BLOG"
    headline: "서비스와 개발의 기록을 연결합니다."
    description: "회원 인증과 연습·평가 API를 개발합니다. 팀 블로그의 디자인과 게시 흐름을 다듬어 개발 경험을 기록으로 남깁니다."
    accent: "#7771a5"
    tint: "#efedf8"
  - name: "박찬형"
    role: "DATA · BACKEND"
    headline: "소리와 악보를 쓸 수 있는 데이터로."
    description: "국악 음원과 악보를 정리하고 변환·검증합니다. 곡·악보 조회 API와 평가 연동, 회원 탈퇴 등 서버 기능도 개발합니다."
    accent: "#a17c2f"
    tint: "#faf2d9"
  - name: "사지한"
    role: "AI · DATA"
    headline: "연주를 이해할 기준을 만듭니다."
    description: "녹음의 음높이를 추정하고 악보와 비교해 연주를 평가합니다. 평가 데이터와 검증 도구로 채점의 품질을 확인합니다."
    accent: "#5d7e4b"
    tint: "#edf4e6"
  - name: "우동균"
    role: "INFRA · BACKEND"
    headline: "개발부터 운영까지 이어줍니다."
    description: "빌드·배포 자동화와 백업·복구 등 운영 기반을 만듭니다. 공통 개발 스킬과 도구를 구축하고, 서버 연동과 실제 앱 검증을 함께 맡습니다."
    accent: "#597b9b"
    tint: "#eaf1f8"
together:
  kicker: "HOW WE WORK"
  title: "따로 만들고, 같이 맞춥니다."
  paragraphs:
    - "악보, 화면, 서버, 채점, 배포. 각자 맡은 부분을 만들고 서로 이어 보며 얼쑤를 완성해 가고 있습니다."
  link: "개발 기록 읽기"
