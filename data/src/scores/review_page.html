<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정간보 검토</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1f1d1a; --muted: #6b665e; --line: #dcd8d0;
    --accent: #2f5d8a; --low: #c8432f; --mid: #d08a1e; --ok: #2e7d4f; --sel: #2f5d8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header .grow { flex: 1; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(360px, 1fr); gap: 12px; padding: 12px 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  #pageWrap { position: relative; overflow: auto; max-height: calc(100vh - 120px); }
  #pageWrap img { display: block; width: 100%; height: auto; }
  #boxes { position: absolute; inset: 0; }
  .box { position: absolute; border: 2px solid var(--line); cursor: pointer; }
  .box span { position: absolute; left: 1px; top: 0; font-size: 10px; line-height: 1; padding: 1px 2px; background: rgba(255,255,255,.85); }
  .box.low { border-color: var(--low); } .box.mid { border-color: var(--mid); } .box.done { border-color: var(--ok); background: rgba(46,125,79,.08); }
  .box.sel { outline: 3px solid var(--sel); outline-offset: 1px; z-index: 1; }
  .row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  canvas#crop { border: 1px solid var(--line); background: #fff; max-width: 100%; }
  label, .meta { color: var(--muted); font-size: 12px; }
  /* 정간 미리보기: 띄어쓰기 = 위→아래 줄, 이어 쓰기 = 왼→오른쪽 */
  .jg { display: grid; width: 170px; min-height: 210px; border: 2px solid var(--ink); background: #fff; }
  .jg .r { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-bottom: 1px dashed var(--line); }
  .jg .r:last-child { border-bottom: 0; }
  /* 시김새는 원본 악보처럼 율명 오른쪽에 붙인다 */
  .u { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 1px; padding: 2px; }
  .u + .u { border-left: 1px dashed var(--line); }
  .core { cursor: pointer; border-radius: 4px; padding: 0 4px; text-align: center; line-height: 1.1; }
  .core .hz { font: 26px/1.1 "Batang", "BatangChe", "Noto Serif KR", serif; display: block; }
  .core .hg { font-size: 10px; color: var(--muted); display: block; }
  .sym { cursor: pointer; border-radius: 3px; }
  .sym img { height: 24px; width: 18px; object-fit: contain; display: block; }
  .core:hover, .sym:hover { background: #e8eef5; }
  input#edit { width: 100%; font: 18px/1.4 "Malgun Gothic", sans-serif; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  #msg { min-height: 1.5em; font-size: 12px; }
  #msg.err { color: var(--low); }
  .buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; background: #fff; }
  /* 팔레트: 우물사이처럼 위쪽 탭(율 | 시김새), 누르면 커서 자리에 들어간다 */
  #palette { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fbfaf8; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-radius: 0; background: transparent; padding: 6px 14px; color: var(--muted); }
  .tabs button.on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px var(--accent); }
  .pane { padding: 8px; max-height: 340px; overflow: auto; }
  .pane h3 { font-size: 12px; margin: 6px 0 4px; color: var(--muted); font-weight: 600; }
  .pgrid { display: grid; grid-template-columns: 52px repeat(12, minmax(30px, 1fr)); gap: 3px; align-items: center; min-width: 470px; }
  .pgrid b { font-size: 11px; color: var(--muted); font-weight: 500; }
  .pbtn { padding: 2px 0; line-height: 1.05; text-align: center; }
  .pbtn .hz { font: 20px/1.1 "Batang", "BatangChe", "Noto Serif KR", serif; display: block; }
  .pbtn .hg { font-size: 9px; color: var(--muted); }
  .flex { display: flex; flex-wrap: wrap; gap: 4px; }
  .sbtn { display: flex; flex-direction: column; align-items: center; width: 64px; padding: 4px 2px; }
  .sbtn img { height: 40px; width: 52px; object-fit: contain; }
  .sbtn span { font-size: 9px; color: var(--muted); line-height: 1.1; margin-top: 2px; word-break: keep-all; }
  #overview { margin-top: 12px; display: grid; gap: 4px; max-height: 32vh; overflow: auto; }
  .gak { display: flex; gap: 4px; align-items: stretch; }
  .gak b { width: 36px; flex: none; font-size: 11px; color: var(--muted); align-self: center; }
  .chip { flex: 1; min-width: 0; font-size: 11px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #fff; }
  .chip.low { border-color: var(--low); } .chip.mid { border-color: var(--mid); } .chip.done { background: rgba(46,125,79,.12); border-color: var(--ok); }
  .chip.sel { outline: 2px solid var(--sel); }
  .chip.changed { font-weight: 600; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } #pageWrap { max-height: 60vh; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span id="progress" class="meta"></span>
  <label><input type="checkbox" id="onlyLow"> 신뢰도 0.5 미만만 이동</label>
  <label>확대 <input type="range" id="zoom" min="60" max="250" value="100"></label>
  <span class="grow"></span>
  <button id="saveJgb" class="primary">.jgb.json 저장</button>
  <button id="saveJson">검토 기록 저장</button>
  <button id="reset">처음 결과로</button>
</header>
<main>
  <section class="card"><div id="pageWrap"><img id="page" alt="악보 원본"><div id="boxes"></div></div></section>
  <section>
    <div class="card">
      <div class="row">
        <div><label>원본 칸</label><br><canvas id="crop"></canvas></div>
        <div><label>입력 결과</label><div id="preview" class="jg"></div></div>
      </div>
      <p class="meta" id="info"></p>
      <input id="edit" autocomplete="off" spellcheck="false" aria-label="정간 입력">
      <div id="msg"></div>
      <div class="buttons">
        <button id="prev">이전 <kbd>↑</kbd></button>
        <button id="confirm" class="primary">확인하고 다음 <kbd>Enter</kbd></button>
        <button id="next">다음 <kbd>↓</kbd> <kbd>Tab</kbd></button>
        <button id="insert">뒤에 빈 정간 넣기</button>
        <button id="remove">이 정간 지우기</button>
      </div>
      <p class="meta">우물사이와 같은 문법: 띄어 쓰면 칸 안에서 위→아래로 줄이 나뉘고, 이어 쓰면 한 줄에 왼→오른쪽으로 나란히 들어갑니다. <code>-</code> 이음, <code>쉼</code> 쉼표, 음 뒤 <code>{흘림표}</code> 시김새, 음 뒤 <code>&lt;</code> 숨표. 미리보기의 글자를 누르면 입력칸에서 그 글자가 선택되어, 팔레트로 바로 바꿀 수 있습니다. <kbd>Ctrl ←</kbd> <kbd>Ctrl →</kbd> 옆 각.</p>
      <div id="palette">
        <div class="tabs"><button data-tab="yul" class="on">율</button><button data-tab="sig">시김새</button></div>
        <div class="pane" id="pane"></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px"><label>곡 전체 (한 줄이 한 각)</label><div id="overview"></div></div>
  </section>
</main>
<script>
const DATA = /*DATA*/null;
const $ = id => document.getElementById(id);
const YUL_RE = "(?:하하배|하배|중청|배|청)?[황대태협고중유임이남무응]";
const PITCH = new RegExp(`^${YUL_RE}$`);

// ── 처음 결과: JG-like → 우물사이 정간 문법 ─────────────────────────────
// jeongganbo-generator tools/import-ngc-omr.mjs(MIT)의 token·cellOf·convertCell에서 글자를 만드는
// 부분을 옮겼다. 검토 화면은 처음부터 우물사이 문법으로 보여 주고 고치므로, 저장할 때 다시 바꾸지 않는다.
const ALIAS = { "니나*": "{니나}", "니나": "{니라}", "느니-르": "{느니르}", "니루-니": "{니루니}",
  "반길이표/덧길이표": "{반길이표}{덧길이표}", "덧길이표/반길이표": "{덧길이표}{반길이표}", "쉼표": "쉼표" };
function slot(p) {
  if (p === 0) return [1, 0, "w"];
  if (p <= 9) return [3, Math.floor((p - 1) / 3), ["l", "w", "r"][(p - 1) % 3]];
  return [2, ...({ 10: [0, "w"], 11: [1, "w"], 12: [0, "l"], 13: [0, "r"], 14: [1, "l"], 15: [1, "r"] })[p]];
}
function jgToUm(jg) {
  const groups = [];
  for (const tok of jg.trim().split(/\s+/).filter(Boolean)) {
    const m = tok.match(/^:(\d+)$/);
    m ? groups.push({ pos: +m[1], names: [] }) : groups[groups.length - 1].names.push(tok);
  }
  if (!groups.length) return "";
  const token = t => t in ALIAS ? ALIAS[t] : t === "-" || PITCH.test(t) ? t : `{${t}}`;
  const cellOf = toks => toks && toks.length ? toks.map(token).join("") : "-";
  const grid = Array.from({ length: slot(groups[0].pos)[0] }, () => ({ w: null, l: null, r: null, extra: [] }));
  for (const g of groups) { const [, r, c] = slot(g.pos); grid[r][c] ? grid[r].extra.push(g.names) : (grid[r][c] = g.names); }
  return grid.map(g => (g.w && !(g.l || g.r) ? cellOf(g.w) : (g.l || g.r) ? cellOf(g.l) + cellOf(g.r) + (g.w ? cellOf(g.w) : "") : "-")
    + g.extra.map(cellOf).join("")).join(" ");
}

// ── 우물사이 정간 문법 읽기 ─────────────────────────────────────────────
// 정간 = 줄(띄어쓰기로 나뉨) 목록, 줄 = 음 단위(이어 씀) 목록, 음 단위 = 율명·이음·쉼표 + 숨표 + 시김새.
// 각 조각의 글자 위치(start·end)를 함께 남겨, 미리보기에서 누르면 입력칸의 그 글자를 선택한다.
const UNIT = new RegExp(`(${YUL_RE}|-|쉼표|쉼)?(<)?((?:[{(\\[][^{}()\\[\\]]+[})\\]])*)`, "y");
function parseUm(text) {
  const rows = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(text))) {
    const word = m[0], base = m.index, units = [];
    let i = 0;
    while (i < word.length) {
      UNIT.lastIndex = i;
      const u = UNIT.exec(word);
      if (!u || u[0].length === 0) throw `'${word.slice(i)}'를 읽을 수 없습니다`;
      const syms = [];
      const sre = /[{(\[]([^{}()\[\]]+)[})\]]/g;
      let s, so = i + (u[1] || "").length + (u[2] || "").length;
      while ((s = sre.exec(u[3]))) syms.push({ name: s[1], start: base + so + s.index, end: base + so + s.index + s[0].length });
      units.push({ core: u[1] || "", breath: !!u[2], syms, start: base + i, end: base + i + (u[1] || "").length });
      i += u[0].length;
    }
    rows.push(units);
  }
  return rows;
}

// ── 율명 한자·시김새 그림 ───────────────────────────────────────────────
// 율명 한자는 우물사이(js/app.js의 YUL·OCT_HANJA)와 같은 표, 시김새 그림은 우물사이 기호 그림(MIT)이다.
const YULS = ["황", "대", "태", "협", "고", "중", "유", "임", "이", "남", "무", "응"];
const HANJA = {
  "": [..."黃大太夾姑仲蕤林夷南無應"],
  "중청": ["㶂", "", "㳲", "㴺", "㵈", "㴢", "㶙", "㵉", "㴣", "㵜", "㶃", "㶝"],
  "청": ["潢", "汏", "汰", "浹", "㴌", "㳞", "㶋", "淋", "洟", "湳", "潕", "㶐"],
  "배": ["僙", "㐲", "㑀", "俠", "㑬", "㑖", "", "㑣", "侇", "㑲", "㒇", "㒣"],
  "하배": ["㣴", "㣕", "㣖", "㣣", "㣨", "㣡", "㣸", "㣩", "", "㣮", "㣳", "㣹"],
};
const OCTS = [["중청", "중청"], ["청", "청"], ["", "중(기본)"], ["배", "배"], ["하배", "하배"]];
function hanjaOf(name) {
  const m = name.match(new RegExp(`^(하하배|하배|중청|배|청)?([황대태협고중유임이남무응])$`));
  return m && HANJA[m[1] || ""] ? HANJA[m[1] || ""][YULS.indexOf(m[2])] || null : null;
}
const glyph = n => n === "-" ? "－" : n === "쉼" || n === "쉼표" ? "△" : hanjaOf(n) || n;
const SIGIMSAE = {
  "자주 쓰는 표": ["흘림표", "미는표", "농음표", "요성표", "겹요성표", "퇴성", "추성", "전성", "떠이어표", "끊는표", "늘임표", "덧길이표", "반길이표", "겹흘림표", "풀어내림표", "루러표", "시루표", "서침표", "특강표", "같은음표"],
  "구음 시김새": ["나니나", "나느나", "니레", "니라", "니로", "노네", "너녜", "노니로", "노리노", "네로네", "느네느", "나니로", "느니라", "느로니르", "느니르", "니루니", "나니르노니르", "노", "니", "로", "리", "니나", "느나", "노라", "느니", "노라느니", "니레나", "네로나", "니로나", "니느라니", "느나니나", "느나르나니"],
};
const symImg = n => DATA.symbols[n];

// ── 상태 ───────────────────────────────────────────────────────────────
const KEY = "jgb-review-um:" + DATA.source + ":" + DATA.title;
const fresh = () => DATA.cells.map(c => ({ ...c, um: jgToUm(c.jg), orig: jgToUm(c.jg), done: false }));
// 변환을 다시 해 정간이 늘었으면(예: 놓친 칸을 격자로 채움) 브라우저에 남은 작업과 칸 위치로 합친다.
// 같은 상자의 정간은 고친 내용·확인 표시를 그대로 쓰고, 새 상자는 처음 결과로 넣는다.
// 직접 넣은 정간(상자 없음)은 바로 앞에 있던 상자 정간 뒤에 그대로 둔다.
function merge(saved) {
  const base = fresh(), key = c => `${c.x},${c.y}`;
  if (saved.length === base.length && saved.every((c, i) => key(c) === key(base[i]) || c.x == null)) return saved;
  const old = new Map(saved.filter(c => c.x != null).map(c => [key(c), c]));
  const out = base.map(b => old.has(key(b)) ? { ...b, um: old.get(key(b)).um, done: old.get(key(b)).done } : b);
  let after = -1;
  for (const s of saved) {
    if (s.x != null) { after = out.findIndex(c => key(c) === key(s)); continue; }
    out.splice(after + 1, 0, s); after++;
  }
  return out;
}
let cells = (s => s ? merge(s) : fresh())(load());
let cur = 0;
const img = $("page");
img.src = DATA.image;
$("title").textContent = DATA.title;
function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(cells)); } catch {} }
const level = c => c.done ? "done" : c.conf == null ? "" : c.conf < 0.2 ? "low" : c.conf < 0.5 ? "mid" : "";
const gakOf = i => DATA.beats ? Math.floor(i / DATA.beats) : cells[i].gak;

// ── 그리기 ─────────────────────────────────────────────────────────────
function renderPreview(rows) {
  const el = $("preview");
  el.style.gridTemplateRows = `repeat(${Math.max(rows.length, 1)}, 1fr)`;
  el.innerHTML = rows.map(units => `<div class="r">${units.map(u =>
    `<div class="u">${u.core ? `<span class="core" data-s="${u.start}" data-e="${u.end}"><span class="hz">${glyph(u.core)}</span><span class="hg">${hanjaOf(u.core) ? u.core : u.core === "-" ? "이음" : u.core.startsWith("쉼") ? "쉼표" : ""}</span></span>` : ""}` +
    u.syms.map(s => `<span class="sym" data-s="${s.start}" data-e="${s.end}" title="${s.name}">${symImg(s.name) ? `<img src="${symImg(s.name)}" alt="${s.name}">` : s.name}</span>`).join("") +
    `${u.breath ? "<span class=hg>숨</span>" : ""}</div>`).join("")}</div>`).join("");
}

function renderBoxes() {
  const sx = img.clientWidth / img.naturalWidth;
  $("boxes").innerHTML = "";
  cells.forEach((c, i) => {
    if (c.x == null) return;  // 직접 넣은 정간은 상자가 없다
    const b = document.createElement("div");
    b.className = `box ${level(c)} ${i === cur ? "sel" : ""}`;
    Object.assign(b.style, { left: c.x * sx + "px", top: c.y * sx + "px", width: c.w * sx + "px", height: c.h * sx + "px" });
    b.innerHTML = `<span>${i + 1}</span>`;
    b.onclick = () => go(i);
    $("boxes").appendChild(b);
  });
}

function renderOverview() {
  const byGak = new Map();
  cells.forEach((c, i) => { const g = gakOf(i); if (!byGak.has(g)) byGak.set(g, []); byGak.get(g).push(i); });
  $("overview").innerHTML = "";
  for (const [g, idx] of byGak) {
    const row = document.createElement("div");
    row.className = "gak";
    row.innerHTML = `<b>${g + 1}각</b>`;
    for (const i of idx) {
      const c = cells[i], chip = document.createElement("div");
      chip.className = `chip ${level(c)} ${i === cur ? "sel" : ""} ${c.um !== c.orig ? "changed" : ""}`;
      chip.title = `${i + 1}번 ${c.um || "(빈칸)"}`;
      chip.textContent = c.um || "·";
      chip.onclick = () => go(i);
      row.appendChild(chip);
    }
    $("overview").appendChild(row);
  }
  $("progress").textContent = `확인 ${cells.filter(c => c.done).length} / ${cells.length} · 고친 정간 ${cells.filter(c => c.um !== c.orig).length}`;
}

function renderCrop() {
  const c = cells[cur], cv = $("crop"), ctx = cv.getContext("2d");
  if (c.x == null) { cv.width = 170; cv.height = 60; ctx.fillStyle = "#888"; ctx.fillText("직접 넣은 정간(상자 없음)", 10, 34); return; }
  const pad = 6, k = Math.min(3, 260 / c.w);
  cv.width = (c.w + pad * 2) * k; cv.height = (c.h + pad * 2) * k;
  ctx.drawImage(img, c.x - pad, c.y - pad, c.w + pad * 2, c.h + pad * 2, 0, 0, cv.width, cv.height);
}

function renderPalette(tab) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const pane = $("pane");
  if (tab === "yul") {
    const used = [...new Set(cells.flatMap(c => { try { return parseUm(c.um).flat().map(u => u.core); } catch { return []; } }).filter(x => PITCH.test(x)))];
    const btn = n => `<button class="pbtn" data-ins="${n}" title="${n}"><span class="hz">${glyph(n)}</span><span class="hg">${n}</span></button>`;
    pane.innerHTML = `<h3>이 곡에 나온 율명 · 특수 기호</h3><div class="flex">${used.map(btn).join("")}
        <button class="pbtn" data-ins="-"><span class="hz">－</span><span class="hg">이음</span></button>
        <button class="pbtn" data-ins="쉼"><span class="hz">△</span><span class="hg">쉼표</span></button>
        <button class="pbtn" data-ins="<"><span class="hz">&lt;</span><span class="hg">숨표</span></button>
        <button class="pbtn" data-ins=" "><span class="hz">␣</span><span class="hg">줄 나눔</span></button></div>
      <h3>전체 율명</h3><div class="pgrid"><b></b>${YULS.map(y => `<b style="text-align:center">${y}</b>`).join("")}
        ${OCTS.map(([o, t]) => `<b>${t}</b>` + YULS.map(y => hanjaOf(o + y) ? btn(o + y) : "<span></span>").join("")).join("")}</div>`;
  } else {
    pane.innerHTML = `<p class="meta">원본 칸의 작은 기호와 모양이 같은 것을 누르면 커서 자리(음 바로 뒤)에 들어갑니다.</p>` +
      Object.entries(SIGIMSAE).map(([t, list]) => `<h3>${t}</h3><div class="flex">${list.map(s =>
        `<button class="sbtn" data-ins="{${s}}" title="${s}">${symImg(s) ? `<img src="${symImg(s)}" alt="${s}">` : ""}<span>${s}</span></button>`).join("")}</div>`).join("");
  }
}

// ── 편집 ───────────────────────────────────────────────────────────────
function onEdit() {
  try {
    const rows = parseUm($("edit").value);
    renderPreview(rows);
    const unknown = rows.flat().flatMap(u => u.syms).map(s => s.name).filter(n => !symImg(n));
    $("msg").className = unknown.length ? "err" : "";
    $("msg").textContent = unknown.length ? `우물사이 기호 사전에 없는 시김새: ${unknown.join(", ")}` : "";
    return true;
  } catch (e) { $("msg").className = "err"; $("msg").textContent = e; return false; }
}
function commit() {
  if (!onEdit()) return false;
  cells[cur].um = $("edit").value.trim().replace(/\s+/g, " ");
  save(); return true;
}
function go(i, keepSel) {
  cur = Math.max(0, Math.min(cells.length - 1, i));
  const c = cells[cur];
  $("edit").value = c.um;
  $("info").textContent = `${cur + 1}번째 정간 · ${gakOf(cur) + 1}각` +
    (c.conf != null ? ` · 신뢰도 ${c.conf.toFixed(2)}` : " · 글자 층에서 읽음") +
    (c.um !== c.orig ? ` · 처음 결과 ${c.orig || "(빈칸)"}` : "");
  onEdit(); renderCrop(); renderBoxes(); renderOverview();
  document.querySelector(".box.sel")?.scrollIntoView({ block: "nearest", inline: "nearest" });
  $("edit").focus();
  if (!keepSel) $("edit").setSelectionRange(c.um.length, c.um.length);
}
function step(d) {
  let i = cur + d;
  if ($("onlyLow").checked) while (i >= 0 && i < cells.length && !(cells[i].conf != null && cells[i].conf < 0.5 && !cells[i].done)) i += d;
  if (i >= 0 && i < cells.length) go(i);
}
function stepGak(d) {  // 옆 각의 같은 순번 정간. 열은 오른쪽부터 읽으므로 ← 가 다음 각이다.
  const g = gakOf(cur), idx = cells.map((_, i) => i).filter(i => gakOf(i) === g).indexOf(cur);
  const target = cells.map((_, i) => i).filter(i => gakOf(i) === g + d);
  if (target.length) go(target[Math.min(idx, target.length - 1)]);
}
function insertText(t) {
  const el = $("edit");
  el.focus();
  el.setRangeText(t, el.selectionStart, el.selectionEnd, "end");
  commit(); onEdit(); renderOverview(); renderBoxes();
}

$("edit").addEventListener("input", () => { if (commit()) { renderOverview(); renderBoxes(); } });
$("edit").addEventListener("keydown", e => {
  if (e.isComposing) return;
  if (e.key === "Enter") { e.preventDefault(); $("confirm").click(); }
  else if (e.key === "Tab") { e.preventDefault(); commit(); step(e.shiftKey ? -1 : 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); commit(); step(-1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); commit(); step(1); }
  else if (e.ctrlKey && e.key === "ArrowLeft") { e.preventDefault(); commit(); stepGak(1); }
  else if (e.ctrlKey && e.key === "ArrowRight") { e.preventDefault(); commit(); stepGak(-1); }
});
$("preview").addEventListener("click", e => {
  const t = e.target.closest("[data-s]"); if (!t) return;
  $("edit").focus(); $("edit").setSelectionRange(+t.dataset.s, +t.dataset.e);
  if (t.classList.contains("sym")) renderPalette("sig"); else renderPalette("yul");
});
$("palette").addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); });  // 입력칸 선택 유지
$("palette").addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]"); if (tab) return renderPalette(tab.dataset.tab);
  const b = e.target.closest("[data-ins]"); if (b) insertText(b.dataset.ins);
});
$("confirm").onclick = () => { if (commit()) { cells[cur].done = true; save(); cur === cells.length - 1 ? go(cur) : step(1); } };
$("prev").onclick = () => { commit(); step(-1); };
$("next").onclick = () => { commit(); step(1); };
$("insert").onclick = () => {
  commit();
  cells.splice(cur + 1, 0, { jg: "", um: "", orig: "", gak: cells[cur].gak, conf: null, x: null, done: false, inserted: true });
  save(); go(cur + 1);
};
$("remove").onclick = () => { if (confirm(`${cur + 1}번째 정간을 지울까요?`)) { cells.splice(cur, 1); save(); go(cur); } };
$("reset").onclick = () => { if (confirm("고친 내용과 확인 표시를 모두 지우고 처음 결과로 돌아갈까요?")) { cells = fresh(); save(); go(0); } };
$("zoom").oninput = () => { img.style.width = $("zoom").value + "%"; renderBoxes(); };
window.addEventListener("resize", renderBoxes);

// ── 저장 ───────────────────────────────────────────────────────────────
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$("saveJgb").onclick = () => {
  commit();
  const bad = cells.findIndex(c => { try { parseUm(c.um); return false; } catch { return true; } });
  if (bad >= 0) { go(bad); alert(`${bad + 1}번째 정간을 읽을 수 없어 저장하지 않았습니다.`); return; }
  const gaks = [];
  cells.forEach((c, i) => { (gaks[gakOf(i)] ||= []).push(c.um); });
  const rows = gaks.filter(Boolean);
  // 각 길이: 가장 흔한 길이가 기본, 다른 각은 '각번호:정간수'(import-ngc-omr.mjs gakLengths와 같다)
  const freq = {};
  for (const r of rows) freq[r.length] = (freq[r.length] || 0) + 1;
  const beats = +Object.entries(freq).sort((a, b) => b[1] - a[1] || b[0] - a[0])[0][0];
  const doc = structuredClone(DATA.doc);
  doc.parts[0].melody = rows.map(r => r.join(" | ")).join("\n");
  Object.assign(doc.controls, { beats: String(beats), gakCount: String(rows.length),
    gakBeats: rows.map((r, i) => r.length === beats ? null : `${i + 1}:${r.length}`).filter(Boolean).join(", ") });
  download(`${DATA.title}.jgb.json`, JSON.stringify(doc), "application/json");
};
$("saveJson").onclick = () => {
  commit();
  const out = { title: DATA.title, source: DATA.source, reviewedOn: new Date().toISOString().slice(0, 10),
    confirmed: cells.filter(c => c.done).length, total: cells.length,
    cells: cells.map((c, i) => ({ index: i, gak: gakOf(i), cell: c.um, original: c.orig, omrJg: c.jg, confirmed: c.done,
      inserted: !!c.inserted, conf: c.conf, box: c.x == null ? null : [c.x, c.y, c.w, c.h] })) };
  download(`${DATA.title}.review.json`, JSON.stringify(out, null, 1), "application/json");
};

renderPalette("yul");
img.onload = () => go(0);
if (img.complete) go(0);
</script>
</body>
