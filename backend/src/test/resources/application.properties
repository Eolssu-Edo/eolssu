# 테스트 JAR에만 포함되는 공개 고정 키. 실제 앱에는 AUTH_CODE_HMAC_SECRET을 별도로 주입한다.
eolssu.auth.code-hmac-secret=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
# DB 검사는 고정 ID 회원을 SQL로 지우고 다시 만들어 캐시가 이전 회원 상태를 남길 수 있다. 캐시 무효화는 TokenRefresh·PasswordChange·PasswordReset 검사가 운영 값 10초로 확인한다.
eolssu.auth.session-cache-ttl=0s
