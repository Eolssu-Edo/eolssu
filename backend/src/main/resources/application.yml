spring:
  application:
    name: eolssu
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    access:
      default: none
    web:
      base-path: /api/actuator
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
