spring:
  application:
    name: eolssu
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  servlet:
    multipart:
      # 녹음 업로드(PRA-02)의 20MiB 경계는 RecordingFileValidator가 413으로 판정한다.
      # 앞 계층 한도는 스펙대로 multipart 파일·요청 25MiB, Nginx 25m(Nginx는 S15P31E102-181)이다.
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

eolssu:
  auth:
    code-hmac-secret: ${AUTH_CODE_HMAC_SECRET:}
    mail-mode: ${AUTH_MAIL_MODE:unavailable}
  security:
    jwt-secret: ${AUTH_JWT_SECRET:}
    # 같은 사이트 밖에서 API를 부르는 개발용 주소(쉼표로 구분). 운영은 웹과 API가 같은 주소라 비워 둔다.
    allowed-origins: ${SECURITY_ALLOWED_ORIGINS:}

management:
  endpoints:
    access:
      default: none
    web:
      base-path: /api/actuator
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
