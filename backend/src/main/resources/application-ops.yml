# 운영 프로필: 업무 API를 기존 DB로 제공하되 Flyway는 끈다. 스키마 변경은 db 프로필로 따로 적용한다(backend README).
spring:
  autoconfigure:
    exclude: []
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: -1
      minimum-idle: 0
      # 업무 API와 업로드 만료 작업이 함께 쓴다. 헬스체크 전용일 때의 3개에서 Hikari 기본값으로 올렸다.
      maximum-pool-size: 10
      # 시각은 UTC로 저장·비교한다(db 프로필과 같음).
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: false
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath*:mybatis/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

# /api/** 문서 경로도 기존 access_token·ACTIVE 회원 검증을 받는다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
