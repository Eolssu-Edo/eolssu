{{ define "main" }}
<section class="intro">
  <h1>{{ site.Title }}</h1>
  <p>{{ site.Params.description }}</p>
</section>

<section aria-label="최근 글">
  <h2 class="section-title">최근 글</h2>
  {{ range first 10 (where site.RegularPages "Section" "posts") }}
    {{ partial "post-card.html" . }}
  {{ else }}
    <p>아직 글이 없어요.</p>
  {{ end }}
</section>
{{ end }}
