{{ define "main" }}
<article class="post">
  <header>
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "posts" }}{{ partial "post-meta.html" . }}{{ end }}
  </header>
  <div class="post-body">
    {{ .Content }}
  </div>
  {{ with .Params.tags }}
  <footer class="post-tags">
    {{ range . }}<a href="{{ "tags/" | relURL }}{{ . | urlize }}/">#{{ . }}</a>{{ end }}
  </footer>
  {{ end }}
</article>
{{ end }}
