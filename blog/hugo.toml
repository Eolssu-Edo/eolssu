# 배포 주소는 Jenkins에서 --baseURL로 덮어씀 (blog/Jenkinsfile 참고)
baseURL = "https://team-ido.github.io/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
title = "이도 기술 블로그"
enableRobotsTXT = true
summaryLength = 60

[params]
  description = "SSAFY 15기 E102 팀 이도의 개발 기록"
  team = "이도"

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[menus]
  [[menus.main]]
    name = "글"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "태그"
    pageRef = "/tags"
    weight = 20
  [[menus.main]]
    name = "소개"
    pageRef = "/about"
    weight = 30

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  style = "github"
  lineNos = false
