# 배포 주소는 Jenkins에서 --baseURL로 덮어씀 (Jenkinsfile 참고)
baseURL = "https://team-edo.github.io/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
title = "얼쑤 · Team Edo"
enableRobotsTXT = true
summaryLength = 60

[params]
  description = "국악기 연습 프로젝트 얼쑤와 Team Edo의 개발 기록"
  team = "Team Edo"

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[menus]
  [[menus.main]]
    name = "프로젝트"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "블로그"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    name = "팀 소개"
    pageRef = "/about"
    weight = 30

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false
  style = "github"
  lineNos = false

# Read-only source mounts: store processed-image cache in HUGO_CACHEDIR.
[caches.images]
  dir = ":cacheDir/images"
