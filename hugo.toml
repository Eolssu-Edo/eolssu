# 배포 주소는 Jenkins에서 --baseURL로 덮어씀 (Jenkinsfile 참고)
baseURL = "https://team-edo.github.io/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
title = "얼쑤 · Team Edo"
enableRobotsTXT = true
summaryLength = 60

[params]
  description = "국악기 연습 프로젝트 얼쑤와 Team Edo의 개발 기록"
  team = "Team Edo"

  # 글 상세의 댓글·좋아요(giscus, GitHub Discussions에 저장).
  # repoId·categoryId가 비어 있으면 댓글 영역을 표시하지 않음. 값은 https://giscus.app 에서 확인 (README 참고, 2026-11-03 설정)
  [params.giscus]
    repo = "team-edo/team-edo.github.io"
    repoId = "R_kgDOVX3GyQ"
    category = "Comments"
    categoryId = "DIC_kwDOVX3Gyc4DKS5M"

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[menus]
  [[menus.main]]
    identifier = "blog"
    name = "블로그"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    identifier = "project"
    name = "프로젝트"
    pageRef = "/project"
    weight = 20
  [[menus.main]]
    identifier = "team"
    name = "팀 소개"
    pageRef = "/about"
    weight = 30

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false
  style = "github"
  lineNos = false

# Read-only source mounts: store processed-image cache in HUGO_CACHEDIR.
[caches.images]
  dir = ":cacheDir/images"
