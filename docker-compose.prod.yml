name: eolsu-prod

services:
  backend:
    image: ${BACKEND_IMAGE:-eolsu-backend:prod}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_PORT: "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.30.6-alpine
    depends_on:
      - backend
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:?HTTP_PORT를 지정하세요}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
