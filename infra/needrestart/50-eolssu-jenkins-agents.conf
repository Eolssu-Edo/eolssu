# S15P31E102-758: 자동 보안 업데이트(unattended-upgrades) 뒤 needrestart가
# Jenkins 에이전트를 바로 재시작하면 실행 중인 빌드·배포가 끊긴다.
# 에이전트 4개(host·ai·blog·web)는 재시작을 미루고, 빌드가 없을 때 사람이 재시작한다.
# 원본: infra/needrestart/ · 설치: /etc/needrestart/conf.d/
$nrconf{override_rc}->{qr(^eolssu-jenkins-(?:[a-z]+-)?agent\.service$)} = 0;
