# Only container logs sent to this loopback input enter this ruleset.
module(load="imtcp")
template(name="EolssuDailyLog" type="string"
  string="/var/log/eolssu/ordinary/%programname%.%$year%-%$month%-%$day%.log")
ruleset(name="EolssuContainerLogs") {
  if ($programname == "eolssu-frontend" or $programname == "eolssu-backend" or
      $programname == "eolssu-ai" or $programname == "eolssu-mysql") then {
    action(type="omfile" dynaFile="EolssuDailyLog" createDirs="on"
      fileOwner="syslog" fileGroup="adm" dirOwner="syslog" dirGroup="adm" fileCreateMode="0600" dirCreateMode="0700"
      dynaFileCacheSize="16" closeTimeout="1")
  }
  stop
}
input(type="imtcp" address="127.0.0.1" port="1514" ruleset="EolssuContainerLogs")
