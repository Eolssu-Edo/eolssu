# Grafana. 운영 스택 eolssu-runtime의 MySQL에 읽기 계정으로 붙는다. Metabase는 S15P31E102-202에서 뺐다.
# 실행 방법은 README.md
name: eolssu-monitoring

services:
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 지정하세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000" # 서버 밖에 열지 않는다. 접속은 SSH 터널로
    networks: [runtime]
    restart: unless-stopped

networks:
  runtime: # 운영 스택의 내부 네트워크. MySQL을 서비스 이름 mysql로 찾는다
    external: true
    name: eolssu-runtime_default

volumes:
  grafana-data:
