# Grafana·Prometheus. Grafana는 운영 MySQL(읽기 계정)과 Prometheus를 읽고, Prometheus는 백엔드 수치를 모은다.
# 실행 방법은 README.md
name: eolssu-monitoring

services:
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 지정하세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000" # 서버 밖에 열지 않는다. 접속은 SSH 터널로
    networks: [runtime]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # 서버 밖에 열지 않는다. Grafana는 prometheus:9090으로 읽는다
    healthcheck: # 서버 점검(edo-check)이 Docker healthcheck로 준비 상태를 본다
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [runtime]
    restart: unless-stopped

networks:
  runtime: # 운영 스택의 내부 네트워크. MySQL을 서비스 이름 mysql로 찾는다
    external: true
    name: eolssu-runtime_default

volumes:
  grafana-data:
  prometheus-data:
