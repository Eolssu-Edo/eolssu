server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 경로에 ';'가 있으면 막는다. Spring은 경로 조각의 ';' 뒤를 떼어 내서, Nginx가 다른 경로로 본
    # /api;x/actuator/prometheus 같은 요청을 actuator로 처리한다.
    location ~ ";" {
        return 404;
    }

    # 점검 주소(actuator)는 readiness만 밖에 연다. 수치(prometheus) 등은 서버 안에서 backend:8080으로만 읽는다.
    location = /api/actuator/health/readiness {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/actuator {
        return 404;
    }

    location / {
        # 녹음 업로드(PRA-02)의 앞 계층 한도. 20MiB 판정은 백엔드가 공통 오류 형식 413으로 한다.
        client_max_body_size 25m;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
