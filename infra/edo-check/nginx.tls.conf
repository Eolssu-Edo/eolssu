limit_req_zone $binary_remote_addr zone=edo_check:10m rate=5r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 15.165.144.7;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/edo-check/acme;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 15.165.144.7;
    ssl_certificate /etc/letsencrypt/live/edo2-static-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edo2-static-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    include /etc/nginx/snippets/qa-phone.conf;

    location = /integrations/mattermost/commands {
        limit_except POST { deny all; }
        limit_req zone=edo_check burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8765;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location / { return 404; }
}
