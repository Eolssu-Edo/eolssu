pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

stream {
    resolver 127.0.0.11 ipv6=off valid=5s;
    server {
        listen 3306;
        set $mysql mysql:3306;
        proxy_connect_timeout 2s;
        proxy_timeout 1h;
        proxy_pass $mysql;
    }
}
