log_format standby_safe '$request_method $uri $status';
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/standby-tls/localhost.crt;
    ssl_certificate_key /etc/nginx/standby-tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /dev/stdout standby_safe;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;

    location ~ ";" { return 404; }
    location = /api/actuator/health/readiness { proxy_pass $backend; }
    location /api/actuator { return 404; }
    location /api/internal/ { return 404; }
    location = /api/recordings/read { return 404; }

    location /api/ {
        client_max_body_size 25m;
        proxy_pass $backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
