# edo2 호스트 Nginx의 운영 도메인 가상 호스트(S15P31E102-930). 승격 때 /etc/nginx/sites-enabled/eolssu-failover로 설치한다.
# 기존 default의 IP 가상 호스트·점검 중계와 겹치지 않도록 server_name을 운영 도메인 하나로 한정한다.
# 인증서는 최신 config 백업에서 꺼낸 edo1 사본을 /etc/eolssu-failover-tls/에 둔다. 경로는 failover-runbook.md를 따른다.
# Ubuntu 24.04의 nginx 1.24 문법을 사용한다(http2 지시어 대신 listen 매개변수).

server {
    listen 80;
    listen [::]:80;
    server_name k15e102.p.ssafy.io;
    server_tokens off;

    # 승격 기간이 길어지면 edo2 certbot이 같은 경로로 HTTP-01 갱신을 받는다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/eolssu-failover-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name k15e102.p.ssafy.io;
    server_tokens off;

    ssl_certificate /etc/eolssu-failover-tls/k15e102.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/eolssu-failover-tls/k15e102.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 녹음 업로드 한도는 대기 프런트(nginx.conf)와 같다.
    client_max_body_size 25m;

    location / {
        # 대기 프런트는 127.0.0.1:18443에서 격리 검사용 localhost 인증서로만 응답한다.
        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /opt/eolssu-standby-579/tls/localhost.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
