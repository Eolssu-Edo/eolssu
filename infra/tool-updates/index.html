<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'"><title>Eolssu Updates</title><link rel="stylesheet" href="style.css"></head><body><nav class="tabs" role="tablist" aria-label="화면">
 <button id="tab-updates" role="tab" aria-controls="updates-panel" aria-selected="true">업데이트·연결</button>
 <button id="tab-qa" role="tab" aria-controls="site-panel" aria-selected="false" tabindex="-1">QA</button>
 <button id="tab-blog" role="tab" aria-controls="site-panel" aria-selected="false" tabindex="-1">블로그</button>
 <button id="tab-grafana" role="tab" aria-controls="site-panel" aria-selected="false" tabindex="-1">Grafana</button>
 <button id="tab-prometheus" role="tab" aria-controls="site-panel" aria-selected="false" tabindex="-1">Prometheus</button>
 <button id="tab-jenkins" role="tab" aria-controls="site-panel" aria-selected="false" tabindex="-1">Jenkins</button>
 <button id="tab-db" role="tab" aria-controls="site-panel" aria-selected="false" tabindex="-1">DB</button>
 <button id="tab-n8n" role="tab" aria-controls="site-panel" aria-selected="false" tabindex="-1">n8n</button>
 <button id="tab-playstore" title="기본 브라우저에서 열기" role="tab" aria-controls="site-panel" aria-selected="false" tabindex="-1">PlayStore출시</button>
</nav>
<main id="updates-panel" role="tabpanel" aria-labelledby="tab-updates">
<section class="card" id="graph-cleanup" aria-labelledby="graph-title" hidden>
 <div class="line graph-row">
  <h2 id="graph-title">Graphify 정리</h2>
  <p class="detail">이 프로젝트에 받은 그래프를 휴지통으로 이동합니다.</p>
  <button id="cleanup-graph" class="secondary">정리</button>
 </div>
 <p class="error" id="graph-error" role="status"></p>
</section>
<section class="card" aria-labelledby="coco-title">
 <div class="line">
  <h2 id="coco-title">COCO</h2>
  <div class="install-row">
   <label class="sr-only" for="version">배포 버전</label>
   <select id="version" disabled><option value="">확인 중</option></select>
   <label class="sr-only" for="runtime">설치 대상</label>
   <select id="runtime"><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="both" selected>Codex/Claude</option></select>
   <label class="sr-only" for="scope">적용 위치</label>
   <select id="scope"><option value="project">현재 프로젝트</option><option value="global">전역</option></select>
   <button id="install" class="secondary" disabled>설치·업데이트</button>
  </div>
 </div>
 <p class="sr-only" id="coco-status" aria-live="polite">npm 배포 목록을 확인합니다.</p>
 <p class="detail" id="coco-result" role="status"></p><p id="coco-error" class="error" role="status"></p>
</section>
<div class="action-cards">
<section class="card app-files" aria-labelledby="apps-title">
 <div class="line"><h2 id="apps-title">다운로드</h2>
  <button id="phone-apk" class="secondary" disabled>폰 APK</button>
  <button id="tablet-apk" class="secondary" disabled>태블릿 APK</button>
  <button id="iphone-ipa" class="secondary" disabled>아이폰 IPA</button>
 </div>
 <p id="apps-message" class="detail" role="status"></p>
</section>
<section class="card connections" aria-labelledby="connection-title">
 <div class="line connection-row"><h2 id="connection-title">연결</h2>
  <button id="ssh-edo1" class="secondary" aria-label="edo1 연결" title="터미널에서 edo1 열기">edo1</button>
  <button id="ssh-edo2" class="secondary" aria-label="edo2 연결" title="터미널에서 edo2 열기">edo2</button>
 </div>
</section>
</div>
<section class="card settings" aria-label="이 기기 설정">
 <div class="path-row"><label for="project">프로젝트</label>
  <input id="project" readonly placeholder="Git 프로젝트의 최상위 폴더">
  <button id="choose" class="secondary">폴더 선택</button>
 </div>
</section>
<div class="footer"><span id="message" role="status">설정은 이 기기에만 저장됩니다.</span><button id="check" class="quiet">지금 확인</button><button id="test" class="quiet">알림 테스트</button><button id="notification-settings" class="quiet">알림 설정</button></div><p id="notification-error" class="error" role="status"></p>
<div class="preferences-row">
 <label class="check"><input type="checkbox" id="auto">모든 업데이트 자동 반영</label>
 <label class="check"><input type="checkbox" id="startup" aria-describedby="startup-detail">로그인 시 실행</label>
 <span id="startup-detail" class="sr-only"></span>
</div>
</main>
<section id="site-panel" role="tabpanel" hidden>
 <p id="site-state" role="status"></p>
 <div id="site-connect-row" hidden><button id="site-connect" class="primary">SSH edo1 연결</button></div>
 <div class="site-actions">
  <button id="site-retry" class="secondary" hidden>다시 연결</button>
  <button id="site-browser" class="quiet">브라우저에서 열기</button>
 </div>
 <form id="playstore-form" class="line" hidden>
  <label for="playstore-link">출시 링크</label>
  <input id="playstore-link" type="password" autocomplete="off" spellcheck="false" required placeholder="Doply 비공개 링크 붙여넣기">
  <button id="playstore-save" class="primary" type="submit">저장하고 열기</button>
 </form>
 <p id="site-error" class="error" role="status"></p>
</section>
<script src="renderer.js"></script></body></html>
