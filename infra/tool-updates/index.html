<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'"><title>Eolssu Updates</title><link rel="stylesheet" href="style.css"></head><body><nav class="tabs" role="tablist" aria-label="화면"><button id="tab-updates" role="tab" aria-selected="true">업데이트</button><button id="tab-qa" role="tab" aria-selected="false">QA</button></nav><main id="updates-panel">
<section class="card" aria-labelledby="graph-title"><div class="line"><h2 id="graph-title">Graphify</h2><span class="badge" id="graph-badge">프로젝트 연결 필요</span><span class="detail grow" id="graph-detail"></span><span id="graph-time" class="timestamp"></span><button id="download" class="primary" disabled>다운로드</button></div><p class="status" id="graph-status" aria-live="polite">프로젝트를 선택하면 새 그래프를 확인합니다.</p></section>
<section class="card" aria-labelledby="coco-title"><div class="line"><h2 id="coco-title">COCO</h2><span class="badge" id="coco-badge">확인 중</span></div><div class="install-row"><label class="sr-only" for="version">배포 버전</label><select id="version"><option value="">확인 중</option></select><label class="sr-only" for="runtime">설치 대상</label><select id="runtime"><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="both">둘 다</option></select><label class="sr-only" for="scope">적용 위치</label><select id="scope"><option value="project">현재 프로젝트</option><option value="global">개인 전역</option></select><button id="install" class="secondary" disabled>설치·업데이트</button></div><p class="sr-only" id="coco-status" aria-live="polite">npm 배포 목록을 확인합니다.</p><p class="detail" id="coco-result"></p><p id="coco-error" class="error" role="status"></p></section>
<section class="card app-files" aria-label="최신 앱"><div class="line"><h2>바로가기</h2><button id="phone-apk" class="secondary" disabled>폰 APK</button><button id="tablet-apk" class="secondary" disabled>태블릿 APK</button><button id="iphone-ipa" class="secondary" disabled>아이폰 IPA</button><button id="ssh-edo1" class="secondary">SSH edo1</button><button id="ssh-edo2" class="secondary">SSH edo2</button></div><p id="apps-message" class="detail" role="status"></p></section><section class="card settings" aria-label="이 기기 설정"><div class="path-row"><label for="project">프로젝트</label><input id="project" readonly placeholder="Git 프로젝트의 최상위 폴더"><button id="choose" class="secondary">폴더 선택</button></div><div class="options-row"><label for="host">SSH</label><input id="host" value="edo1" spellcheck="false" autocomplete="off"><label class="check"><input type="checkbox" id="auto">그래프 자동 다운로드</label><label class="check"><input type="checkbox" id="startup" checked>로그인 시 실행</label><span id="startup-detail" class="sr-only"></span><button id="save" class="primary">설정 저장</button></div></section>
<div class="footer"><span id="message" role="status">설정은 이 기기에 저장됩니다.</span><button id="check" class="quiet">지금 확인</button><button id="test" class="quiet">알림 테스트</button><button id="notification-settings" class="quiet">알림 설정</button></div><p id="notification-error" class="error" role="status"></p>
</main><section id="qa-panel" hidden><p id="qa-state" role="status">QA 페이지를 연결합니다.</p><button id="qa-retry" class="secondary">다시 연결</button><button id="qa-browser" class="quiet">브라우저에서 열기</button></section><script src="renderer.js"></script></body></html>
