[project]
name = "ai-service"
version = "0.1.0"
description = "얼쑤 연주 평가: 음높이 추정·정렬·채점"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "librosa>=0.11",
    "numpy>=2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest>=8",
]
# 음높이 추정 비교용. 서비스 기본 의존성에는 넣지 않는다.
eval = ["torchcrepe>=0.0.23"]
# 악보 인식 서비스(omr_service, 별도 컨테이너) 전용. PDF 쪽 그림화·이미지 읽기.
omr = [
    "pillow>=13.0.0",
    "pymupdf>=1.26,<1.27",  # 2.x는 쓰지 않는 onnxruntime·pymupdf4llm을 함께 받는다
    "pypdfium2>=5.14.0",
]

[tool.uv]
# 악보 인식(omr_service) 테스트도 `uv run pytest`로 돈다. 이미지 빌드는 --no-default-groups로 그룹을 빼고 받는다.
default-groups = ["dev", "omr"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service", "src/omr_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
