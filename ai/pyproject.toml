[project]
name = "ai-service"
version = "0.1.0"
description = "얼쑤 연주 평가: 음높이 추정·정렬·채점"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11",
    "numpy>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
