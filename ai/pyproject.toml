[project]
name = "ai-service"
version = "0.1.0"
description = "얼쑤 연주 평가: 음높이 추정·정렬·채점"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "librosa>=0.11",
    "numpy>=2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8"]
# 음높이 추정 비교용. 서비스 기본 의존성에는 넣지 않는다.
eval = ["torchcrepe>=0.0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
